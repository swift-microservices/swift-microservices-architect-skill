schema_version: "1.1"
name: reviews-seeded-loans-package
expected_outcome: |
  Finds the seeded problems: Serve connects as the database owner (bypasses row-level security); LoansGRPC imports LoansPostgres, reads configuration, builds a Postgres client and enforces the loan limit itself instead of through a use case; the use case has untyped throws, a private helper, try?, a Task {}, a variable filled by the do, a force unwrap and String(reflecting:) logging; the repository is @unchecked Sendable with a mutable cache; the handler's switch has a default and a force unwrap inside the arguments; the PostgresClient is left out of the ServiceGroup; plaintext gRPC and Postgres without TLS; no signal to LoanWorkflow; a read, a decision in Swift and an unconditional write outside a transaction; a use case holding a repository instead of a database and scope. Findings are ranked blocking/major/minor with file and line, rule and fix, and no code is changed.
context:
  scaffold_script: place-files.sh
